
<!-- ========== Article Strip (HTML + CSS + JS) ========== -->
<section class="sn-section bg-light">
  <div class="container-fluid">
    <div class="text-center">
        <h2 class="section-heading text-uppercase">Top Stories</h2>
    </div>
    <div class="sn-header">
      <div class="sn-header-left">
        <div class="sn-time-marker">LAST FEW HOURS</div>
        <h2>Scroll Strip</h2>
      </div>

      <div class="sn-controls">
        <button class="sn-btn" data-dir="left" aria-label="Scroll left">←</button>
        <button class="sn-btn" data-dir="right" aria-label="Scroll right">→</button>
      </div>
    </div>

    <div class="sn-strip-wrapper">
      <div class="sn-strip" id="newsStrip" role="list" aria-label="Top stories"></div>
    </div>
  </div>
</section>

<style>
  .sn-section { --gap: 16px; --card-w: 280px; --radius: 16px; --shadow: 0 6px 20px rgba(0,0,0,.12); padding: 3rem 0; overflow-x: clip; }
  @media (max-width: 575.98px) {
    .sn-section {
        padding-bottom: 1.5rem;
    }
  }
  .sn-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }

  .sn-header-left {
    display: flex;
    flex-direction: column;
  }

  .sn-header h2 { font-size:1.1rem; margin:0; letter-spacing:.2px; }
  .sn-controls { display:flex; gap:8px; }
  .sn-btn { border:1px solid rgba(0,0,0,.1); background:#fff; border-radius:999px; padding:8px 12px; cursor:pointer; }
  .sn-btn:hover { background:#f7f7f7; }
  
  .sn-strip-wrapper{
    width: 100%;
    max-width: 100%;
    overflow: hidden;          /* clamps anything that tries to extend */
  }

  /* The actual horizontal scroller */
  .sn-strip{
    display: flex;
    gap: var(--gap);

    overflow-x: auto;
    overflow-y: hidden;

    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;

    padding: 6px 2px 10px;

    /* These help iOS + prevent layout weirdness */
    min-width: 0;
    overscroll-behavior-x: contain;
    touch-action: pan-x;       /* important: lets the element own horizontal gestures */
  }

  .sn-strip::-webkit-scrollbar { height: 8px; }
  .sn-strip::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 999px; }

  /* Each card should NOT stretch / should behave like a carousel item */
  .sn-card{
    flex: 0 0 auto;
    width: var(--card-w);
    max-width: 85vw;           /* keeps it sane on tiny screens */
    scroll-snap-align: start;

    /* keep your existing styles below */
    border-radius: var(--radius);
    background:#fff; box-shadow: var(--shadow);
    text-decoration:none; color:inherit;
    overflow:hidden; transform:translateZ(0);
    transition:transform .15s ease, box-shadow .15s ease;
  }

  .sn-card:hover, .sn-card:focus-visible { transform:translateY(-2px); box-shadow:0 10px 28px rgba(0,0,0,.18); outline:none; }
  .sn-media { position:relative; aspect-ratio:16/9; background:#eee; overflow:hidden; }
  .sn-media img:not(.sn-favicon) { width:100%; height:100%; object-fit:cover; display:block; }
  .sn-badge {
    position:absolute; left:10px; bottom:10px;
    background:rgba(0,0,0,.7); color:#fff; font-size:.75rem;
    padding:4px 8px; border-radius:999px; backdrop-filter:saturate(140%) blur(2px);
    display:flex; align-items:center; gap:6px;
  }
  .sn-body { padding:12px 14px 14px; display:grid; gap:6px; }
  .sn-title { font-size:18px; line-height:1.25; font-weight:700; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .sn-meta { font-size:.8rem; color:#666; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sn-dot { width:4px; height:4px; background:#bbb; border-radius:50%; display:inline-block; }
  .sn-favicon { width:14px; height:14px; border-radius:4px; }

  /* NLP chips + emotion bars */
  .sn-tags {
    margin-top: 2px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .sn-tag {
    padding: 2px 6px;
    background: #f3f4f6;
    border-radius: 999px;
    font-size: 0.7rem;
    color: #374151;
  }

  .sn-emotions {
    margin-top: 4px;
  }
  .sn-emobar-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    margin-top: 2px;
  }
  .sn-emobar-label {
    color: #4b5563;
    min-width: 48px;
  }
  .sn-emobar-track {
    flex: 1;
    height: 5px;
    border-radius: 999px;
    background: #e5e7eb;
    overflow: hidden;
  }
  .sn-emobar-fill {
    height: 100%;
    border-radius: 999px;
    background: #10b981;
  }
  .sn-emobar-value {
    color: #6b7280;
    min-width: 32px;
    text-align: right;
  }

  @media (max-width:480px) {
    .sn-section { --card-w: 240px; }
    .sn-header h2 { font-size:1rem; }
  }


  .sn-badges {
    margin-top: 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
</style>

  function fetchRSSArticlesForScrollStrip(feedUrl, category) {
    $.ajax({
      url: "rss_proxy.php",
      method: "POST",
      cache: false,
      data: { feed: feedUrl },
      dataType: "json",
      success: function(response) {
        const articles = response.items || [];
        renderNewsStrip("newsStrip", articles);
      },
      error: function() {
        console.warn("RSS fetch failed for Scroll Strip");
      }
    });
  }

  function timeAgo(iso) {
    const diff = (Date.now() - new Date(iso).getTime())/1000;
    const units = [
      ["day", 86400],
      ["hour", 3600],
      ["min", 60]
    ];
    for (const [u, s] of units) {
      const v = Math.floor(diff / s);
      if (v >= 1) return `${v} ${u}${v>1?"s":""} ago`;
    }
    return "just now";
  }

  // derive publisher/domain from URL when not provided
  function extractDomain(url) {
    try {
      const u = new URL(url);
      let host = u.hostname || "";
      if (host.startsWith("www.")) host = host.slice(4);
      return host || "Unknown";
    } catch (e) {
      return "Unknown";
    }
  }

  function snAnalysisUrl(term, window = "24h", context = "entity", extra = {}) {
    if (!term) return "analysis.php";

    const params = new URLSearchParams({
      context: context,
      value: term,
      w: window,
      ...extra
    });

    return `analysis.php?${params.toString()}`;
  }


  function renderNewsStrip(elId, articles) {
    const strip = document.getElementById(elId);
    if (!strip) return;

    strip.innerHTML = articles.map(a => {
      const link    = a.link || a.url || "#";
      const image   = a.image || a.image_url || "assets/img/news-placeholder.jpg";
      const pubDate    = a.pubDate || a.pub_date || new Date().toISOString();
      const pubForLink = a.pubDateForLink || a.pub_date_ts || a.pub_date || pubDate;

      // Safe category: use a.category (RSS), or a.source_slug (DB), else "Politics"
      const rawCategory = a.category || a.source_slug || "Politics";
      const category = rawCategory
        ? rawCategory.charAt(0).toUpperCase() + rawCategory.slice(1)
        : "Politics";

      // Publisher / domain logic
      const domainOrSource = a.publisher || a.source || extractDomain(link);

      const encodedUrl = encodeURIComponent(link);
      const encodedCategory = encodeURIComponent(category);

      let newsroomLink = `newsroom.php?url=${encodedUrl}&category=${encodedCategory}&pub_date=${encodeURIComponent(pubForLink)}`;

      // If this article came from the DB, tag it so newsroom.php can branch logic
      if (a.fromDb) {
        newsroomLink += "&db=1";
      }

      // Favicon uses the domain
      const faviconUrl =
        "https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=" +
        encodeURIComponent("http://" + domainOrSource) +
        "&size=64";

      const safeTitle = a.title || "";

      // NLP bits (only present for DB-backed articles)
      const hashtags = Array.isArray(a.hashtags) ? a.hashtags : [];
      const sentimentLabel = a.sentiment_label || null;
      const sentimentScore = a.sentiment_score;
      const emotions = Array.isArray(a.emotions) ? a.emotions : [];

      // 🔹 Badges (deep dive / high-signal)
      const badges = Array.isArray(a.badges) ? a.badges : [];

      // Sentiment emoji
      let sentimentEmoji = "";
      if (sentimentLabel === "positive") sentimentEmoji = "😊";
      else if (sentimentLabel === "negative") sentimentEmoji = "😔";
      else if (sentimentLabel === "neutral")  sentimentEmoji = "😐";

      // Hashtag chips
      let hashtagsHtml = "";
      if (hashtags.length) {
        hashtagsHtml = `
          <div class="sn-tags">
            ${hashtags.map(tag => `<span class="sn-tag">${tag}</span>`).join("")}
          </div>
        `;
      }

      // Emotion bars (full width, using top 3 already preselected in PHP)
      let emotionsHtml = "";
      if (emotions.length) {
        emotionsHtml = `
          <div class="sn-emotions">
            ${emotions.map(e => {
              const rawVal = typeof e.value === "number" ? e.value : parseFloat(e.value) || 0;
              const width = Math.min(100, Math.max(5, rawVal)); // clamp between 5–100
              const label = e.label || "";
              const displayVal = Math.round(rawVal);

              return `
                <div class="sn-emobar-row">
                  <span class="sn-emobar-label">${label}</span>
                  <div class="sn-emobar-track">
                    <div class="sn-emobar-fill" style="width: ${width}%;"></div>
                  </div>
                  <span class="sn-emobar-value">${displayVal}%</span>
                </div>
              `;
            }).join("")}
          </div>
        `;
      }

       // 🔹 Badge pills (non-clickable; whole card is already an <a>)
      let badgesHtml = "";
      if (badges.length) {
        badgesHtml = `
          <div class="sn-badges scroll-article-badges">
            ${badges.map(badge => {
              const slug = badge.slug || "";
              const label = badge.label || "";
              const tooltip = badge.tooltip || "";
              return `
                <span class="scroll-badge scroll-badge-${slug}" title="${tooltip}">
                  ${label}
                </span>
              `;
            }).join("")}
          </div>
        `;
      }

      return `
        <a class="sn-card" role="listitem" href="${newsroomLink}" rel="noopener noreferrer" aria-label="Open article: ${safeTitle}" data-loading>
          <div class="sn-media">
            <img src="${image}" alt="${safeTitle}" onerror="this.src = 'assets/img/news-placeholder.jpg';" loading="lazy" decoding="async">
            <span class="sn-badge">
              <img src="${faviconUrl}" alt="${domainOrSource} logo" class="sn-favicon">
              ${domainOrSource}
            </span>
          </div>
          <div class="sn-body">
            <div class="sn-title">${safeTitle} ▶️</div>
            <div class="sn-meta">
              <span>${domainOrSource}</span>
              ${sentimentEmoji ? `<span class="sn-dot" aria-hidden="true"></span><span>${sentimentEmoji}</span>` : ""}
              <span class="sn-dot" aria-hidden="true"></span>
              <time datetime="${pubDate}">${timeAgo(pubDate)}</time>
            </div>
            ${badgesHtml}     <!-- 🔹 NEW -->
            ${hashtagsHtml}
            ${emotionsHtml}
          </div>
        </a>
      `;
    }).join("");

    // Horizontal wheel scroll (desktop)
    strip.addEventListener("wheel", (e) => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        strip.scrollLeft += e.deltaY * 0.9;
        e.preventDefault();
      }
    }, { passive: false });

    // Keyboard left/right when focused
    strip.tabIndex = 0;
    strip.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") strip.scrollBy({ left: strip.clientWidth * 0.9, behavior: "smooth" });
      if (e.key === "ArrowLeft")  strip.scrollBy({ left: -strip.clientWidth * 0.9, behavior: "smooth" });
    });

    // Arrow buttons
    const section = strip.closest(".sn-section");
    if (!section) return;
    section.querySelectorAll(".sn-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const dir = btn.dataset.dir === "right" ? 1 : -1;
        strip.scrollBy({ left: dir * strip.clientWidth * 0.9, behavior: "smooth" });
      });
    });
  }

  // --- INIT ---
  (function initScrollStrip() {
    if (Array.isArray(dbArticlesRaw) && dbArticlesRaw.length > 0) {
      const mapped = dbArticlesRaw.map(row => {
        const pubDate = row.pub_date; // e.g. "2025-12-03 13:34:00+00"
        const ts = Math.floor(new Date(pubDate).getTime() / 1000); // Unix seconds

        return {
          ...row,
          category: row.source_slug,
          pub_date: pubDate,
          pubDateForLink: ts,
          fromDb: true
        };
      });

      renderNewsStrip("newsStrip", mapped);
    } else {
      const rssUrl = "https://rss.app/feeds/tahaOzLGHPxMD9OC.xml";
      fetchRSSArticlesForScrollStrip(rssUrl);
    }
  })();
</script>
