            <h2>Axis 1: <a href="https://en.wikipedia.org/wiki/Gazette" target="_blank">Gazette</a></h2>
            <div class="description mb-2" style=""><p>A <b>gazette</b> is an <a href="/wiki/Official_journal" class="mw-redirect" title="Official journal">official journal</a>, a <a href="/wiki/Newspaper_of_record" title="Newspaper of record">newspaper of record</a>, or simply a <a href="/wiki/Newspaper" title="Newspaper">newspaper</a>. </p><p>In English and French speaking countries, newspaper publishers have applied the name <i>Gazette</i> since the 17th century; today, numerous weekly and daily newspapers bear the name <i>The Gazette</i>. </p><div class="mt-5 images"></div></div></div></div></div>
